<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семья Кропачевых</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>Семья Кропачевых</h1>
    <p>Если че то не так-это артем</p>
    <div class="family-card">
        <h2>Я по вам соскучилась очень очень</h2>

        <p>смотрите какие мы миленькие</p>
        </div>
        <div class="family-main-photo">
        <img src="mmm.jpg" alt="Вся наша семья">
        </div>
    <div class="family-section">
        <h2>Все туууут</h2>

        <p>круто да?</p>
        <div class="family-members">


            <div class="member">
                <div class="member-photo">
                    <img src="img_123.jpg" alt="Мама">
            </div>
            
                <h3>Мама</h3>
                <p>Миленькая</p>
            </div>

            <div class="member">
                <div class="member-photo">
                    <img src="papi.jpg" alt="Папа">
                </div>
                 <h3>Папа</h3>
                 <p>счастливый то, с рыбкой</p>
            </div>
            <div class="member">
                 <div class="member-photo">
                    <img src="dochkaa.jpg" alt="Дочка">
                 </div>
                 <h3>Это яя</h3>
                 <p>Любимая доченька</p>
             </div>

             <div class="member">
                 <div class="member-photo">
                     <img src="artemm.jpg" alt="Артём">
                 </div>
                 <h3>темка</h3>
                 <p>Тоже сынок любимый</p>
            </div>
            <div class="member">
                 <div class="member-photo">
                     <img src="babushka.jpg" alt="Бабушка">
                 </div>
                <h3>Бабушка</h3>
                <p>мудрая, но ворчливая</p>
                 </div>
        </div>

    </div>

</body>
<link rel="stylesheet" href="style.css">
</html>
